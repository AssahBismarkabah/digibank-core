server.port: ${SERVER_PORT:8083}
spring:
  application.name: transaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:transaction;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
clients:
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
