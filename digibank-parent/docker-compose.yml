services:
  postgres:
    image: postgres:16-alpine
    container_name: digibank-db
    environment:
      POSTGRES_DB: digibank_db
      POSTGRES_USER: digibank_user
      POSTGRES_PASSWORD: digibank_pwd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digibank_user -d digibank_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digibank-net

  # Development profile: Spring Boot with embedded Tomcat
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: digibank-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digibank_db
      SPRING_DATASOURCE_USERNAME: digibank_user
      SPRING_DATASOURCE_PASSWORD: digibank_pwd
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || wget -q -O /dev/null http://127.0.0.1:8080/api/customers"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - digibank-net
    profiles:
      - dev

  # Production profile: Spring Boot WAR deployed on WildFly
  wildfly:
    build:
      context: .
      dockerfile: docker/spring-boot/Dockerfile
    container_name: digibank-wildfly
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digibank_db
      SPRING_DATASOURCE_USERNAME: digibank_user
      SPRING_DATASOURCE_PASSWORD: digibank_pwd
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - digibank-net
    profiles:
      - wildfly

  # DAST profile: OWASP ZAP baseline scan against the running dev app
  # Usage: docker compose --profile dev --profile zap up --build -d
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: digibank-zap
    volumes:
      - ../dast:/zap/wrk:rw
    command: >
      zap-baseline.py
        -t http://digibank-app:8080
        -J /zap/wrk/reports/zap-report.json
        -r /zap/wrk/reports/zap-report.html
        -x /zap/wrk/reports/zap-report.xml
        -I
    depends_on:
      app:
        condition: service_healthy
    networks:
      - digibank-net
    profiles:
      - zap

networks:
  digibank-net:
    driver: bridge

volumes:
  pgdata:
