version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: digibank-db
    environment:
      POSTGRES_DB: digibank_db
      POSTGRES_USER: digibank_user
      POSTGRES_PASSWORD: digibank_pwd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digibank_user -d digibank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
