server:
  port: 8080

spring:
  application:
    name: digibank-app

  datasource:
    url: jdbc:postgresql://localhost:5432/digibank_db
    username: digibank_user
    password: digibank_pwd
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.digibank: DEBUG
    org.springframework: INFO

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
