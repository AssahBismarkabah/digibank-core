server:
  port: 8080

spring:
  application:
    name: digibank-app

  datasource:
    url: jdbc:postgresql://localhost:5432/digibank_db
    username: digibank_user
    password: digibank_pwd
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

logging:
  level:
    com.digibank: DEBUG
    org.springframework: INFO
