name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test the full multi-module project
        working-directory: digibank-parent
        run: mvn -B clean verify

  app-context-smoke:
    name: Application context smoke
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the Spring Boot application context smoke test
        working-directory: digibank-parent
        run: mvn -B -pl digibank-app -am -Dtest=DigiBankApplicationTests test

  compose-smoke:
    name: Compose smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: embedded-tomcat
            profile: dev
          - name: wildfly
            profile: wildfly

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start the compose stack for ${{ matrix.name }}
        working-directory: digibank-parent
        run: |
          docker compose down -v --remove-orphans || true
          docker compose --profile ${{ matrix.profile }} up --build -d

      - name: Run the existing smoke script
        working-directory: digibank-parent
        env:
          BASE_URL: http://127.0.0.1:8080
        run: ./scripts/smoke-test.sh

      - name: Clean up compose resources
        if: always()
        working-directory: digibank-parent
        run: |
          docker compose down -v --remove-orphans || true
