name: Microservices CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-smoke:
    name: Build, test, containerize, and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: make build
      - name: Build container images
        run: make image-build
      - name: Start stack
        run: make up
      - name: Run smoke checks
        run: make smoke
      - name: Validate running service set
        run: make validate-stack
      - name: Stop stack and remove volumes
        if: always()
        run: make clean

  static-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    needs: build-test-smoke
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('digibank-microservices/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-
      - name: Generate dependency report
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: make sast-dependency-check
      - name: Generate mutation report
        run: make sast-pitest
      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-static-analysis-reports
          path: |
            digibank-microservices/**/target/dependency-check-report.html
            digibank-microservices/**/target/dependency-check-report.json
            digibank-microservices/**/target/pit-reports/**
            digibank-microservices/**/target/site/jacoco/jacoco.xml
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: build-test-smoke
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run SonarCloud analysis
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sast-sonar
      - name: Upload Sonar scanner artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-sonar-scanner
          path: |
            digibank-microservices/**/target/site/jacoco/jacoco.xml
            digibank-microservices/**/target/sonar/**
          if-no-files-found: warn

  dast-newman:
    name: Newman API security checks
    runs-on: ubuntu-latest
    needs: build-test-smoke
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start stack
        run: make up
      - name: Wait for stack readiness
        run: make smoke
      - name: Validate running service set
        run: make validate-stack
      - name: Install Newman
        run: npm install --no-save --no-package-lock newman@6
      - name: Run Newman collection
        working-directory: dast
        run: ./postman/newman-run.sh --env local
      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-newman-reports
          path: dast/reports/**
          if-no-files-found: warn
      - name: Stop stack and remove volumes
        if: always()
        run: make clean

  dast-zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: dast-newman
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: make up
      - name: Wait for stack readiness
        run: make smoke
      - name: Validate running service set
        run: make validate-stack
      - name: Run ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8080/
          allow_issue_writing: false
          fail_action: false
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
      - name: Stop stack and remove volumes
        if: always()
        run: make clean
