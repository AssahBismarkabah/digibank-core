name: Microservices CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-smoke:
    name: Build, test, containerize, and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: make build
      - name: Build container images
        run: make image-build
      - name: Start stack
        run: make up
      - name: Run smoke checks
        run: make smoke
      - name: Validate running service set
        run: make validate-stack
      - name: Stop stack and remove volumes
        if: always()
        run: make clean

  dast-newman:
    name: Newman API security checks
    runs-on: ubuntu-latest
    needs: build-test-smoke
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start stack
        run: make up
      - name: Wait for stack readiness
        run: make smoke
      - name: Validate running service set
        run: make validate-stack
      - name: Install Newman
        run: npm install --no-save --no-package-lock newman@6
      - name: Run Newman collection
        working-directory: dast
        run: ./postman/newman-run.sh --env local --informational
      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-newman-reports
          path: dast/reports/**
          if-no-files-found: warn
      - name: Stop stack and remove volumes
        if: always()
        run: make clean

  dast-zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: dast-newman
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: make up
      - name: Run ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8080/
          allow_issue_writing: false
          fail_action: false
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
      - name: Stop stack and remove volumes
        if: always()
        run: make clean
