name: Microservices CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-smoke:
    name: Build, test, containerize, and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: make build
      - name: Build container images
        run: make image-build
      - name: Start stack
        run: make up
      - name: Run smoke checks
        run: make smoke
      - name: Stop stack and remove volumes
        if: always()
        run: make clean
