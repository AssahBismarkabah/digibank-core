name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test the full multi-module project
        working-directory: digibank-parent
        run: mvn -B clean verify

  app-context-smoke:
    name: Application context smoke
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the Spring Boot application context smoke test
        working-directory: digibank-parent
        run: mvn -B -pl digibank-app -am -Dtest=DigiBankApplicationTests -Dsurefire.failIfNoSpecifiedTests=false test

  compose-smoke:
    name: Compose smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: embedded-tomcat
            profile: dev
          - name: wildfly
            profile: wildfly

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start the compose stack for ${{ matrix.name }}
        working-directory: digibank-parent
        run: |
          docker compose down -v --remove-orphans || true
          docker compose --profile ${{ matrix.profile }} up --build -d

      - name: Run the existing smoke script
        working-directory: digibank-parent
        env:
          BASE_URL: http://127.0.0.1:8080
        run: ./scripts/smoke-test.sh

      - name: Clean up compose resources
        if: always()
        working-directory: digibank-parent
        run: |
          docker compose down -v --remove-orphans || true

  dast-newman:
    name: DAST - Newman
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start the development stack
        working-directory: digibank-parent
        run: |
          docker compose down -v --remove-orphans || true
          docker compose --profile dev up --build -d

      - name: Wait for the application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f digibank-parent/docker-compose.yml logs
          exit 1

      - name: Install Newman and reporters
        run: npm install --no-save --no-package-lock newman newman-reporter-html

      - name: Replay the DAST collection
        run: |
          mkdir -p dast/reports
          npx newman run dast/postman/DigiBank-DAST-Validation.postman_collection.json \
            --environment dast/postman/DigiBank-local.postman_environment.json \
            --reporters cli,json,html \
            --reporter-json-export dast/reports/newman-report.json \
            --reporter-html-export dast/reports/newman-report.html

      - name: Verify Newman reports exist
        if: always()
        run: test -s dast/reports/newman-report.json && test -s dast/reports/newman-report.html

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-dast-reports
          path: dast/reports/newman-report.*
          if-no-files-found: error

      - name: Clean up compose resources
        if: always()
        working-directory: digibank-parent
        run: docker compose down -v --remove-orphans || true

  dast-zap:
    name: DAST - OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: dast-newman
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start the development stack
        working-directory: digibank-parent
        run: |
          docker compose down -v --remove-orphans || true
          docker compose --profile dev up --build -d

      - name: Wait for the application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f digibank-parent/docker-compose.yml logs
          exit 1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8080/
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-dast-report

      - name: Verify ZAP report exists
        if: always()
        run: test -s report_html.html || test -s zap-report.html

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
            zap-report.html
          if-no-files-found: error

      - name: Clean up compose resources
        if: always()
        working-directory: digibank-parent
        run: docker compose down -v --remove-orphans || true
