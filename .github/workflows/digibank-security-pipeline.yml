name: DigiBank Security Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('digibank-microservices/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-
      - name: Run OWASP Dependency-Check
        working-directory: digibank-microservices
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          report_dir="${GITHUB_WORKSPACE}/dast/reports/dependency-check"
          mkdir -p "$report_dir"
          mvn -B org.owasp:dependency-check-maven:12.1.0:check \
            -Ddata.directory="$HOME/.m2/repository/org/owasp/dependency-check-data" \
            -DnvdApiKey="$NVD_API_KEY" \
            -DnvdValidForHours=168 \
            -Danalyzer.ossindex.enabled=false \
            -Dformats=HTML,JSON \
            -DfailBuildOnCVSS=11 \
            -DoutputDirectory="$report_dir"
          # Multi-module executions can write reports under each module's target
          # directory; collect those reports into the CI artifact directory.
          find . -type f \( -name 'dependency-check-report.html' -o -name 'dependency-check-report.json' \) \
            -not -path './target/dependency-check-report.html' \
            -not -path './target/dependency-check-report.json' \
            -exec cp -n {} "$report_dir/" \; || true
      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dast/reports/dependency-check
          if-no-files-found: warn

  container-scan:
    name: Container build and Trivy scan
    runs-on: ubuntu-latest
    needs: dependency-scan
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        working-directory: digibank-microservices
        run: docker compose build
      - name: Scan gateway image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: digibank-microservices-api-gateway
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: digibank-microservices-api-gateway
          format: json
          output: dast/reports/trivy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: dast/reports/trivy-report.json
          if-no-files-found: error
